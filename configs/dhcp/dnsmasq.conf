# Disable DNS port if only serving DHCP, or keep enabled
port=53
listen-address=192.168.5.10
bind-interfaces

# HQ DHCP Pools
dhcp-range=set:hq_hr,192.168.1.100,192.168.1.149,255.255.255.0,24h
dhcp-option=tag:hq_hr,option:router,192.168.1.1
dhcp-option=tag:hq_hr,option:dns-server,192.168.5.20

dhcp-range=set:hq_fin,192.168.2.100,192.168.2.149,255.255.255.0,24h
