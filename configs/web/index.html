<!DOCTYPE html>
<html>
<head>
  <title>Enterprise Multi-Branch Intranet</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; max-width: 600px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    h1 { color: #38bdf8; margin-top: 0; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; background: #0284c7; color: white; font-weight: bold; font-size: 12px; margin-bottom: 16px; }
    ul { list-style-type: none; padding-left: 0; }
    li { padding: 6px 0; border-bottom: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">SECURE MULTI-BRANCH NETWORK</div>
    <h1>Corporate Portal</h1>
    <p>Connected via Secure Multi-Branch OSPF Backbone.</p>
    <ul>
      <li><strong>Server:</strong> DNS / Web Intranet Server (192.168.5.20)</li>
      <li><strong>Gateway:</strong> HQ Core Router (192.168.5.1)</li>
      <li><strong>Sites:</strong> HQ, Branch 1, Branch 2</li>
      <li><strong>Routing:</strong> OSPF Area 0</li>
    </ul>
  </div>
</body>
</html>
